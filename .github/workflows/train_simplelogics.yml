name: SimpleLogics Final NNUE Training

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:

      - name: Checkout SimpleLogics
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            python3 \
            python3-pip \
            wget

      - name: Clone official NNUE trainer
        run: |
          git clone --depth 1 \
            https://github.com/official-stockfish/nnue-pytorch.git \
            nnue-pytorch

      - name: Install Python dependencies
        working-directory: nnue-pytorch
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Compile NNUE data loader
        working-directory: nnue-pytorch
        run: |
          chmod +x compile_data_loader.sh
          ./compile_data_loader.sh

      - name: Download training dataset
        run: |
          mkdir -p data

          wget -L \
            "https://huggingface.co/datasets/official-stockfish/master-smallnet-binpacks/resolve/main/test79-may2022-16tb7p-filter-v6-dd.min-mar2023.unmin.high-simple-eval-1k.min-v2.binpack?download=true" \
            -O data/train.binpack

          echo "TRAINING DATASET"
          ls -lh data/train.binpack
          file data/train.binpack
          du -h data/train.binpack

      - name: Download validation dataset
        run: |
          wget -L \
            "https://huggingface.co/datasets/official-stockfish/master-smallnet-binpacks/resolve/main/test77-jan2022-2tb7p.high-simple-eval-1k.min-v2.binpack?download=true" \
            -O data/validation.binpack

          echo "VALIDATION DATASET"
          ls -lh data/validation.binpack
          file data/validation.binpack
          du -h data/validation.binpack

      - name: Check trainer
        working-directory: nnue-pytorch
        run: |
          python3 train.py --help

      - name: Train SimpleLogics FINAL CANDIDATE
        working-directory: nnue-pytorch
        run: |
          rm -rf ../training-output
          mkdir -p ../training-output

          python3 train.py \
            ../data/train.binpack \
            --validation-datasets \
            ../data/validation.binpack \
            --features="HalfKAv2_hm^" \
            --accelerator=cpu \
            --compile-backend=inductor \
            --batch-size=1024 \
            --num-workers=2 \
            --threads=4 \
            --random-fen-skipping=3 \
            --lambda=1.0 \
            --max-epochs=1 \
            --epoch-size=1000000 \
            --validation-size=50000 \
            --network-save-period=1 \
            --default-root-dir=../training-output

      - name: Show training result
        run: |
          echo "=============================================="
          echo "SIMPLELOGICS FINAL TRAINING RESULT"
          echo "=============================================="

          find training-output \
            -type f \
            -name "*.ckpt" \
            -print

          echo ""
          echo "Training directory:"
          du -sh training-output || true

      - name: Find final checkpoint
        id: checkpoint
        run: |
          CKPT=$(find training-output \
            -type f \
            -name "*.ckpt" \
            | head -n 1)

          if [ -z "$CKPT" ]; then
            echo "ERROR: No checkpoint found."
            exit 1
          fi

          echo "Checkpoint:"
          echo "$CKPT"

          echo "path=$CKPT" >> "$GITHUB_OUTPUT"
      
      - name: Convert FINAL checkpoint to NNUE
        working-directory: nnue-pytorch
        run: |
          CKPT="../${{ steps.checkpoint.outputs.path }}"

          echo "Converting:"
          echo "$CKPT"

          python3 serialize.py \
            "$CKPT" \
            ../SimpleLogics-final.nnue \
            --features="HalfKAv2_hm^"
            
      - name: Verify FINAL NNUE
        run: |
          echo "=============================================="
          echo "SIMPLELOGICS FINAL NNUE"
          echo "=============================================="

          ls -lh SimpleLogics-final.nnue
          file SimpleLogics-final.nnue

          SIZE=$(stat -c%s SimpleLogics-final.nnue)

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: NNUE file is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "NNUE size: $SIZE bytes"
          echo "FINAL NNUE verification passed."

      - name: Calculate NNUE SHA256
        run: |
          sha256sum SimpleLogics-final.nnue

      - name: Upload FINAL NNUE
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Final-NNUE
          path: SimpleLogics-final.nnue
          if-no-files-found: error
          retention-days: 30
