name: Build SimpleLogics Android

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find latest successful FINAL NNUE training
        id: final_nnue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/train_simplelogics.yml/runs?per_page=20" \
            --jq '
              .workflow_runs
              | map(select(.status == "completed" and .conclusion == "success"))
              | .[0].id
            ')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful FINAL NNUE training run found."
            exit 1
          fi

          echo "Latest successful FINAL NNUE run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download FINAL NNUE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p nnue

          gh run download \
            "${{ steps.final_nnue.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "SimpleLogics-Final-NNUE" \
            --dir nnue

          echo "=============================================="
          echo "SIMPLELOGICS FINAL NNUE"
          echo "=============================================="

          ls -lh nnue/
          file nnue/SimpleLogics-final.nnue
          du -h nnue/SimpleLogics-final.nnue

      - name: Prepare NNUE for Stockfish build
        run: |
          mv \
            nnue/SimpleLogics-final.nnue \
            nnue/SimpleLogics-test.nnue

          echo "NNUE selected for build:"
          ls -lh nnue/SimpleLogics-test.nnue
          sha256sum nnue/SimpleLogics-test.nnue

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK r27c
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Add Android NDK to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29

      - name: Build SimpleLogics
        run: |
          cmake --build build-android --config Release -j2

      - name: Verify engine
        run: |
          file build-android/SimpleLogics
          test -x build-android/SimpleLogics

      - name: Upload SimpleLogics FINAL Android
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Android-Final
          path: build-android/SimpleLogics
          if-no-files-found: error
          retention-days: 30
