name: Build SimpleLogics Lc0 Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            ninja-build \
            pkg-config \
            unzip \
            wget

          python3 -m pip install --upgrade meson

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27c
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Clone Lc0
        run: |
          git clone --depth 1 --branch v0.32.1 \
            https://github.com/LeelaChessZero/lc0.git lc0

      - name: Download Android OpenBLAS
        run: |
          mkdir -p deps
          cd deps

          wget -q \
            https://github.com/borg323/OpenBLAS/releases/download/android-0.3.27/openblas-android-aarch64.zip

          unzip -q openblas-android-aarch64.zip

      - name: Create Android cross file
        run: |
          cat > android-aarch64.ini <<EOF
          [binaries]
          c = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang'
          cpp = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++'
          ar = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          EOF

      - name: Configure Lc0
        working-directory: lc0
        run: |
          meson setup arm64-v8a \
            --buildtype=release \
            --cross-file ../android-aarch64.ini \
            -Dgtest=false \
            -Dopenblas=true \
            -Dopenblas_include="$GITHUB_WORKSPACE/deps/android-aarch64/include" \
            -Dopenblas_libdirs="$GITHUB_WORKSPACE/deps/android-aarch64/lib" \
            -Ddefault_library=static

      - name: Build Lc0
        working-directory: lc0
        run: |
          meson compile -C arm64-v8a

      - name: Verify binary
        run: |
          find lc0/arm64-v8a -type f -name lc0 -exec file {} \;
          test -f lc0/arm64-v8a/lc0

      - name: Rename SimpleLogics
        run: |
          mkdir -p output
          cp lc0/arm64-v8a/lc0 output/SimpleLogics
          chmod +x output/SimpleLogics

      - name: Show size
        run: |
          ls -lh output/SimpleLogics
          du -h output/SimpleLogics

      - name: Package
        run: |
          cd output
          zip -9 SimpleLogics-Lc0-Android-arm64.zip SimpleLogics

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Lc0-Android-arm64
          path: output/SimpleLogics-Lc0-Android-arm64.zip
          retention-days: 30
