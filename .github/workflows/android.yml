name: Build SimpleLogics Android

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download SimpleLogics NNUE
        uses: actions/download-artifact@v5
        with:
          name: SimpleLogics-NNUE-test
          path: nnue
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35691167655

      - name: Verify NNUE
        run: |
          echo "=============================================="
          echo "SIMPLELOGICS NNUE"
          echo "=============================================="
          ls -lh nnue/
          file nnue/SimpleLogics-test.nnue
          du -h nnue/SimpleLogics-test.nnue

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK r27c
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Add Android NDK to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29

      - name: Build SimpleLogics
        run: |
          cmake --build build-android --config Release -j2

      - name: Verify engine
        run: |
          file build-android/SimpleLogics
          test -x build-android/SimpleLogics

      - name: Upload SimpleLogics
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Android-NNUE-test
          path: build-android/SimpleLogics
          if-no-files-found: error
