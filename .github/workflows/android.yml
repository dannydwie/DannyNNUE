name: Build SimpleLogics Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK r27c
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Add Android NDK to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29

      - name: Build SimpleLogics
        run: |
          cmake --build build-android --config Release -j2

      - name: Verify engine
        run: |
          file build-android/SimpleLogics
          test -x build-android/SimpleLogics

      - name: Upload SimpleLogics
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-SF19-android-arm64
          path: build-android/SimpleLogics
          if-no-files-found: error
