name: Build SimpleLogics 2600 Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            ninja-build \
            pkg-config \
            unzip \
            wget \
            curl \
            file \
            binutils

          python3 -m pip install --upgrade meson

      - name: Setup Android SDK and NDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-29" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Clone Lc0
        run: |
          git clone \
            --depth 1 \
            --branch v0.32.1 \
            https://github.com/LeelaChessZero/lc0.git lc0

      - name: Download SimpleLogics 2600 Network
        run: |
          mkdir -p network

          wget -q --show-progress \
            "https://storage.lczero.org/files/networks-contrib/t1-256x10-distilled-swa-2432500.pb.gz" \
            -O network/weights-t1-256x10.pb.gz

          test -s network/weights-t1-256x10.pb.gz

          echo "=============================================="
          echo "NETWORK"
          echo "=============================================="

          ls -lh network/weights-t1-256x10.pb.gz

      - name: Download OpenBLAS
        run: |
          mkdir -p deps

          cd deps

          wget -q --show-progress \
            "https://github.com/borg323/OpenBLAS/releases/download/android-0.3.27/openblas-android-aarch64.zip"

          unzip -q openblas-android-aarch64.zip

          echo "OpenBLAS:"
          find . -type f | sort

      - name: Locate OpenBLAS
        run: |
          OPENBLAS_LIB=$(find "$GITHUB_WORKSPACE/deps" \
            -type f \
            -name "libopenblas.a" \
            | head -n 1)

          if [ -z "$OPENBLAS_LIB" ]; then
            echo "ERROR: OpenBLAS library not found"
            exit 1
          fi

          OPENBLAS_ROOT=$(dirname "$(dirname "$OPENBLAS_LIB")")

          echo "OPENBLAS_ROOT=$OPENBLAS_ROOT" >> "$GITHUB_ENV"

          echo "OpenBLAS root:"
          echo "$OPENBLAS_ROOT"

      - name: Create Android cross file
        run: |
          cat > android-aarch64.ini <<EOF

          [binaries]
          c = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang'
          cpp = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++'
          ar = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'

          EOF

          cat android-aarch64.ini

      - name: Check compiler
        run: |
          aarch64-linux-android29-clang --version
          aarch64-linux-android29-clang++ --version

      - name: Configure Lc0
        working-directory: lc0
        run: |
          meson setup arm64-v8a \
            --buildtype=release \
            --cross-file ../android-aarch64.ini \
            -Dgtest=false \
            -Dopenblas=true \
            -Dopenblas_include="$OPENBLAS_ROOT/include" \
            -Dopenblas_libdirs="$OPENBLAS_ROOT/lib" \
            -Ddefault_library=static

      - name: Build Lc0
        working-directory: lc0
        run: |
          meson compile \
            -C arm64-v8a \
            -j2

      - name: Find binary
        run: |
          LC0_BIN=$(find lc0/arm64-v8a \
            -type f \
            -name lc0 \
            | head -n 1)

          if [ -z "$LC0_BIN" ]; then
            echo "ERROR: lc0 binary not found"
            exit 1
          fi

          echo "LC0_BIN=$LC0_BIN" >> "$GITHUB_ENV"

          file "$LC0_BIN"

          ls -lh "$LC0_BIN"

      - name: Create SimpleLogics package
        run: |
          rm -rf output

          mkdir -p output/weights

          cp "$LC0_BIN" output/SimpleLogics

          cp \
            network/weights-t1-256x10.pb.gz \
            output/weights/

          chmod +x output/SimpleLogics

          cat > output/SimpleLogics.config <<EOF
          --backend=blas
          --threads=4
          --nncache=200000
          --weights=weights/weights-t1-256x10.pb.gz
          EOF

          echo "=============================================="
          echo "BINARY"
          echo "=============================================="

          file output/SimpleLogics

          readelf -h output/SimpleLogics | \
            grep -E "Class:|Machine:|Type:"

          echo "=============================================="
          echo "NETWORK"
          echo "=============================================="

          ls -lh output/weights/

          echo "=============================================="
          echo "CONFIG"
          echo "=============================================="

          cat output/SimpleLogics.config

      - name: Validate Android ARM64 binary
        run: |
          file output/SimpleLogics

          readelf -h output/SimpleLogics | \
            grep -q "Machine:.*AArch64"

          readelf -h output/SimpleLogics | \
            grep -q "Class:.*ELF64"

          echo "=============================================="
          echo "ANDROID ARM64 BINARY: OK"
          echo "=============================================="

          echo "UCI test skipped because GitHub runner is x86_64."
          echo "Binary will be tested on Android/DroidFish."

      - name: Package
        run: |
          cd output

          zip -9 -r \
            ../SimpleLogics-2600-Android-arm64.zip \
            SimpleLogics \
            SimpleLogics.config \
            weights

          cd ..

          echo "=============================================="
          echo "FINAL PACKAGE"
          echo "=============================================="

          ls -lh SimpleLogics-2600-Android-arm64.zip

          du -h SimpleLogics-2600-Android-arm64.zip

      - name: Upload SimpleLogics 2600
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-2600-Android-arm64
          path: SimpleLogics-2600-Android-arm64.zip
          if-no-files-found: error
          retention-days: 30
