name: SimpleLogics Download NNUE Dataset

on:
  workflow_dispatch:

jobs:

  download:

    runs-on: ubuntu-latest

    steps:

      - name: Prepare dataset directory
        run: |
          mkdir -p dataset

      - name: Download test NNUE dataset
        run: |
          wget -L \
            "https://huggingface.co/datasets/official-stockfish/master-smallnet-binpacks/resolve/main/test77-jan2022-2tb7p.high-simple-eval-1k.min-v2.binpack?download=true" \
            -O dataset/test.binpack

      - name: Verify dataset
        run: |
          echo "=============================================="
          echo "SIMPLELOGICS NNUE DATASET TEST"
          echo "=============================================="

          ls -lh dataset/test.binpack

          echo ""

          file dataset/test.binpack

          echo ""

          du -h dataset/test.binpack

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-NNUE-test-dataset
          path: dataset/test.binpack
          if-no-files-found: error
