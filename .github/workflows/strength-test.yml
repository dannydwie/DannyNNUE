name: SimpleLogics Automatic Strength Test

on:
  workflow_dispatch:

jobs:
  strength-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout SimpleLogics
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake g++ make python3 python3-pip
          python3 -m pip install --break-system-packages python-chess

      # =====================================================
      # Build SimpleLogics
      # =====================================================

      - name: Build SimpleLogics
        run: |
          cmake -S . -B build-test \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-test --config Release -j2

          chmod +x build-test/SimpleLogics

          echo "===== SimpleLogics UCI ====="
          printf "uci\nquit\n" | build-test/SimpleLogics

      # =====================================================
      # Build Stockfish baseline
      # =====================================================

      - name: Build Stockfish baseline
        run: |
          git clone \
            --depth 1 \
            --branch stockfish-dev-20260919-17a6c8f1 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish-test

          make -C stockfish-test/src -j2 net

          make -C stockfish-test/src -j2 \
            build \
            ARCH=x86-64 \
            COMP=gcc

          chmod +x stockfish-test/src/stockfish

          echo "===== Stockfish UCI ====="
          printf "uci\nquit\n" | stockfish-test/src/stockfish

      # =====================================================
      # Run automatic tournament
      # =====================================================

      - name: Run automatic tournament
        run: |
          cat > strength_test.py <<'PYTHON'
          import chess
          import chess.engine
          import chess.pgn
          import os
          import sys
          import random

          SIMPLELOGICS = os.path.abspath("build-test/SimpleLogics")
          STOCKFISH = os.path.abspath("stockfish-test/src/stockfish")

          GAMES = 100
          NODES_PER_MOVE = 10000
          MAX_PLIES = 180

          # -------------------------------------------------
          # Generate a different opening for every game.
          #
          # The opening is generated deterministically from
          # the game number so the test can be reproduced.
          #
          # We avoid captures/checks during the opening when
          # possible, producing quieter starting positions.
          # -------------------------------------------------

          def generate_opening(game_number):

              rng = random.Random(100000 + game_number)

              board = chess.Board()

              for ply in range(8):

                  legal_moves = list(board.legal_moves)

                  quiet_moves = []

                  for move in legal_moves:

                      if board.is_capture(move):
                          continue

                      board.push(move)

                      if not board.is_check():
                          quiet_moves.append(move)

                      board.pop()

                  if quiet_moves:
                      moves = quiet_moves
                  else:
                      moves = legal_moves

                  # Prefer normal developing moves.
                  preferred = []

                  for move in moves:

                      piece = board.piece_at(move.from_square)

                      if piece is None:
                          continue

                      # Avoid moving the same piece repeatedly
                      if piece.piece_type in (
                          chess.KNIGHT,
                          chess.BISHOP
                      ):
                          preferred.append(move)

                  if preferred:
                      moves = preferred

                  move = rng.choice(moves)

                  board.push(move)

              return list(board.move_stack)

          # -------------------------------------------------
          # Engine configuration
          # -------------------------------------------------

          def configure_engine(engine, human_mode=False):

              options = {
                  "Threads": 1,
                  "Hash": 128
              }

              if "SimpleLogics Human Mode" in engine.options:
                  options["SimpleLogics Human Mode"] = human_mode

              if "SimpleLogics Human Elo" in engine.options:
                  options["SimpleLogics Human Elo"] = 2650

              if "Skill Level" in engine.options:
                  options["Skill Level"] = 20

              engine.configure(options)

          # -------------------------------------------------
          # Play one game
          # -------------------------------------------------

          def play_game(game_number, simple_white):

              print("")
              print("=" * 60)
              print(f"GAME {game_number}/{GAMES}")

              if simple_white:
                  print("SimpleLogics: WHITE")
              else:
                  print("SimpleLogics: BLACK")

              print("=" * 60)

              sl = chess.engine.SimpleEngine.popen_uci(SIMPLELOGICS)
              sf = chess.engine.SimpleEngine.popen_uci(STOCKFISH)

              try:

                  # IMPORTANT:
                  # Full-strength benchmark.
                  configure_engine(sl, human_mode=False)
                  configure_engine(sf, human_mode=False)

                  if "SimpleLogics Human Mode" in sl.options:
                      print("SimpleLogics Human Mode: OFF")

                  board = chess.Board()

                  # Generate a unique deterministic opening.
                  opening = generate_opening(game_number)

                  print("Opening:")

                  for move in opening:
                      print(board.san(move), end=" ")

                  print("")

                  # Apply opening.
                  for move in opening:
                      if move not in board.legal_moves:
                          raise RuntimeError(
                              f"Illegal generated opening move: {move}"
                          )

                      board.push(move)

                  # -------------------------------------------------
                  # PGN
                  # -------------------------------------------------

                  game = chess.pgn.Game()

                  game.headers["Event"] = (
                      "SimpleLogics Automatic Strength Test V2"
                  )

                  game.headers["Round"] = str(game_number)

                  game.headers["White"] = (
                      "SimpleLogics"
                      if simple_white
                      else "Stockfish"
                  )

                  game.headers["Black"] = (
                      "Stockfish"
                      if simple_white
                      else "SimpleLogics"
                  )

                  node = game

                  for move in board.move_stack:
                      node = node.add_variation(move)

                  ply = len(board.move_stack)

                  # -------------------------------------------------
                  # Main game
                  # -------------------------------------------------

                  while (
                      not board.is_game_over(claim_draw=True)
                      and ply < MAX_PLIES
                  ):

                      if (board.turn == chess.WHITE) == simple_white:
                          engine = sl
                      else:
                          engine = sf

                      result = engine.play(
                          board,
                          chess.engine.Limit(
                              nodes=NODES_PER_MOVE
                          )
                      )

                      move = result.move

                      if move is None:
                          break

                      board.push(move)

                      node = node.add_variation(move)

                      ply += 1

                  # -------------------------------------------------
                  # Determine result
                  # -------------------------------------------------

                  if board.is_checkmate():

                      result = (
                          "1-0"
                          if board.turn == chess.BLACK
                          else "0-1"
                      )

                  elif board.is_stalemate():

                      result = "1/2-1/2"

                  elif board.is_insufficient_material():

                      result = "1/2-1/2"

                  elif board.can_claim_fifty_moves():

                      result = "1/2-1/2"

                  else:

                      result = "1/2-1/2"

                  game.headers["Result"] = result

                  # -------------------------------------------------
                  # Save PGN
                  # -------------------------------------------------

                  with open(
                      "strength_test.pgn",
                      "a"
                  ) as pgn_file:

                      exporter = chess.pgn.FileExporter(
                          pgn_file
                      )

                      game.accept(exporter)

                  # -------------------------------------------------
                  # Determine winner
                  # -------------------------------------------------

                  if simple_white:

                      if result == "1-0":
                          winner = "SimpleLogics"

                      elif result == "0-1":
                          winner = "Stockfish"

                      else:
                          winner = "DRAW"

                  else:

                      if result == "0-1":
                          winner = "SimpleLogics"

                      elif result == "1-0":
                          winner = "Stockfish"

                      else:
                          winner = "DRAW"

                  print(f"RESULT: {result}")
                  print(f"WINNER: {winner}")
                  print(f"PLIES: {ply}")

                  return winner

              finally:

                  sl.quit()
                  sf.quit()

          # -------------------------------------------------
          # Start tournament
          # -------------------------------------------------

          open(
              "strength_test.pgn",
              "w"
          ).close()

          wins = 0
          losses = 0
          draws = 0

          for game_number in range(1, GAMES + 1):

              # Alternate colors.
              simple_white = (
                  game_number % 2 == 1
              )

              try:

                  result = play_game(
                      game_number,
                      simple_white
                  )

                  if result == "SimpleLogics":
                      wins += 1

                  elif result == "Stockfish":
                      losses += 1

                  else:
                      draws += 1

              except Exception as error:

                  print("")
                  print("=" * 60)
                  print("TEST ERROR")
                  print("=" * 60)
                  print(error)

                  sys.exit(1)

          # -------------------------------------------------
          # Final result
          # -------------------------------------------------

          print("")
          print("=" * 60)
          print("FINAL RESULT")
          print("=" * 60)

          print(f"Games:        {GAMES}")
          print(f"SimpleLogics: {wins}")
          print(f"Stockfish:    {losses}")
          print(f"Draws:        {draws}")

          score = (
              wins +
              (draws * 0.5)
          )

          percentage = (
              score /
              GAMES *
              100
          )

          print(
              f"Score:        "
              f"{score:.1f}/{GAMES}"
          )

          print(
              f"Score %:      "
              f"{percentage:.1f}%"
          )

          print("=" * 60)

          PYTHON

          python3 strength_test.py

      # =====================================================
      # Upload PGN
      # =====================================================

      - name: Upload tournament PGN
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-strength-test-v2-pgn
          path: strength_test.pgn
          if-no-files-found: error
