name: SimpleLogics A-B Test V2 vs V4

on:
  workflow_dispatch:

jobs:
  ab-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake g++ make python3 python3-pip
          python3 -m pip install --break-system-packages python-chess

      # =====================================================
      # SAVE CURRENT V4
      # =====================================================

      - name: Save V4 configuration
        run: |
          cp CMakeLists.txt CMakeLists.V4

      # =====================================================
      # BUILD V2
      # =====================================================

      - name: Configure V2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          # V4 -> V2
          s = s.replace(
              '&& depth <= 16',
              '&& depth <= 12'
          )

          s = s.replace(
              '] > 3000)',
              '] > 3994)'
          )

          p.write_text(s)
          PY

          echo "===== V2 configuration ====="
          grep -A12 -B3 "Strength V4" CMakeLists.txt || true

          cmake -S . -B build-v2 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-v2 \
            --config Release \
            -j2

          chmod +x build-v2/SimpleLogics

      # =====================================================
      # RESTORE V4
      # =====================================================

      - name: Restore V4 configuration
        run: |
          cp CMakeLists.V4 CMakeLists.txt

      # =====================================================
      # BUILD V4
      # =====================================================

      - name: Configure V4
        run: |
          cmake -S . -B build-v4 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-v4 \
            --config Release \
            -j2

          chmod +x build-v4/SimpleLogics

      # =====================================================
      # VERIFY UCI
      # =====================================================

      - name: Verify both engines
        run: |

          echo "=============================="
          echo "V2 UCI"
          echo "=============================="

          printf "uci\nquit\n" \
            | build-v2/SimpleLogics

          echo "=============================="
          echo "V4 UCI"
          echo "=============================="

          printf "uci\nquit\n" \
            | build-v4/SimpleLogics

      # =====================================================
      # A/B TEST
      # =====================================================

      - name: Run V2 vs V4 A-B test
        run: |

          cat > ab_test.py <<'PYTHON'

          import chess
          import chess.engine
          import chess.pgn
          import random
          import os
          import sys


          # =================================================
          # SETTINGS
          # =================================================

          V2 = os.path.abspath(
              "build-v2/SimpleLogics"
          )

          V4 = os.path.abspath(
              "build-v4/SimpleLogics"
          )

          GAMES = 100

          NODES = 10000

          MAX_PLIES = 180


          # =================================================
          # OPENING
          # =================================================

          def generate_opening(game_number):

              rng = random.Random(
                  100000 + game_number
              )

              board = chess.Board()

              opening = []

              for _ in range(8):

                  legal = list(
                      board.legal_moves
                  )

                  quiet = []

                  for move in legal:

                      if board.is_capture(move):
                          continue

                      board.push(move)

                      gives_check = board.is_check()

                      board.pop()

                      if not gives_check:
                          quiet.append(move)

                  moves = (
                      quiet
                      if quiet
                      else legal
                  )

                  developing = []

                  for move in moves:

                      piece = board.piece_at(
                          move.from_square
                      )

                      if piece and piece.piece_type in (
                          chess.KNIGHT,
                          chess.BISHOP
                      ):
                          developing.append(move)

                  if developing:
                      moves = developing

                  move = rng.choice(moves)

                  opening.append(move)

                  board.push(move)

              return opening


          # =================================================
          # ENGINE CONFIG
          # =================================================

          def configure(engine):

              options = {}

              if "Threads" in engine.options:
                  options["Threads"] = 1

              if "Hash" in engine.options:
                  options["Hash"] = 128

              if "Skill Level" in engine.options:
                  options["Skill Level"] = 20

              if "SimpleLogics Human Mode" in engine.options:
                  options["SimpleLogics Human Mode"] = False

              engine.configure(options)


          # =================================================
          # PLAY GAME
          # =================================================

          def play_game(number):

              v2_white = (
                  number % 2 == 1
              )

              e2 = None
              e4 = None

              try:

                  e2 = (
                      chess.engine
                      .SimpleEngine
                      .popen_uci(V2)
                  )

                  e4 = (
                      chess.engine
                      .SimpleEngine
                      .popen_uci(V4)
                  )

                  configure(e2)
                  configure(e4)

                  board = chess.Board()

                  opening = generate_opening(
                      number
                  )

                  for move in opening:
                      board.push(move)

                  move_count = 0
                  different_moves = 0

                  while (
                      not board.is_game_over(
                          claim_draw=True
                      )
                      and move_count < MAX_PLIES
                  ):

                      if (
                          board.turn == chess.WHITE
                      ) == v2_white:
                          engine = e2
                      else:
                          engine = e4

                      before_fen = board.fen()

                      result = engine.play(
                          board,
                          chess.engine.Limit(
                              nodes=NODES
                          )
                      )

                      move = result.move

                      if move is None:
                          break

                      # -------------------------------------------------
                      # Ask the OTHER engine what it would choose from
                      # exactly the same position.
                      # -------------------------------------------------

                      other = (
                          e4
                          if engine == e2
                          else e2
                      )

                      other_result = other.play(
                          board,
                          chess.engine.Limit(
                              nodes=NODES
                          )
                      )

                      other_move = (
                          other_result.move
                      )

                      if other_move != move:
                          different_moves += 1

                      if move not in board.legal_moves:
                          raise RuntimeError(
                              f"Illegal move: {move}"
                          )

                      board.push(move)

                      move_count += 1

                  if board.is_checkmate():

                      if board.turn == chess.BLACK:
                          result = "1-0"
                      else:
                          result = "0-1"

                  else:
                      result = "1/2-1/2"

                  if v2_white:

                      if result == "1-0":
                          winner = "V2"
                      elif result == "0-1":
                          winner = "V4"
                      else:
                          winner = "DRAW"

                  else:

                      if result == "0-1":
                          winner = "V2"
                      elif result == "1-0":
                          winner = "V4"
                      else:
                          winner = "DRAW"

                  print(
                      f"GAME {number}: "
                      f"{winner} | "
                      f"different decisions: "
                      f"{different_moves}"
                  )

                  return (
                      winner,
                      different_moves
                  )

              finally:

                  if e2:
                      e2.quit()

                  if e4:
                      e4.quit()


          # =================================================
          # TOURNAMENT
          # =================================================

          v2_wins = 0
          v4_wins = 0
          draws = 0

          total_differences = 0

          games_with_difference = 0


          for game in range(
              1,
              GAMES + 1
          ):

              try:

                  winner, differences = (
                      play_game(game)
                  )

                  total_differences += (
                      differences
                  )

                  if differences > 0:
                      games_with_difference += 1

                  if winner == "V2":
                      v2_wins += 1

                  elif winner == "V4":
                      v4_wins += 1

                  else:
                      draws += 1

              except Exception as e:

                  print(
                      "TEST ERROR:",
                      repr(e)
                  )

                  sys.exit(1)


          # =================================================
          # FINAL
          # =================================================

          print("")
          print("=" * 60)
          print("A/B TEST FINAL RESULT")
          print("=" * 60)

          print(
              f"Games:                 {GAMES}"
          )

          print(
              f"V2 wins:               {v2_wins}"
          )

          print(
              f"V4 wins:               {v4_wins}"
          )

          print(
              f"Draws:                 {draws}"
          )

          print(
              f"Games with differences:"
              f" {games_with_difference}"
          )

          print(
              f"Different decisions:   "
              f"{total_differences}"
          )

          print("=" * 60)

          PYTHON

          python3 ab_test.py
