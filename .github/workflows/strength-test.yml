name: SimpleLogics Hybrid V2 Strength Test

on:
  workflow_dispatch:

jobs:
  strength-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout SimpleLogics
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            python3 \
            python3-pip \
            wget

          python3 -m pip install --upgrade pip --break-system-packages

          python3 -m pip install \
            python-chess \
            --break-system-packages


      # ============================================================
      # 3. CLONE EXACT STOCKFISH VERSION
      # ============================================================

      - name: Clone official Stockfish
        run: |
          git clone \
            --depth 1 \
            --branch stockfish-dev-20260919-17a6c8f1 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish-test


      # ============================================================
      # 4. DOWNLOAD OFFICIAL NNUE
      #
      # This ensures BOTH engines use the SAME NNUE.
      # Therefore the test focuses on SEARCH differences.
      # ============================================================

      - name: Download official NNUE
        working-directory: stockfish-test/src
        run: |
          echo "Downloading official Stockfish NNUE..."

          make net

          echo ""
          echo "NNUE files:"
          ls -lh nn-*.nnue

          NET=$(find . \
            -maxdepth 1 \
            -type f \
            -name 'nn-*.nnue' \
            | head -n 1)

          if [ -z "$NET" ]; then
            echo "ERROR: Official NNUE not found."
            exit 1
          fi

          echo ""
          echo "Using official NNUE:"
          echo "$NET"

          cp "$NET" ../../official-stockfish.nnue


      # ============================================================
      # 5. BUILD OFFICIAL STOCKFISH
      # ============================================================

      - name: Build Stockfish baseline
        working-directory: stockfish-test/src
        run: |
          make -j2 build ARCH=x86-64-modern

          if [ ! -f stockfish ]; then
            echo "ERROR: Stockfish binary not found."
            exit 1
          fi

          echo ""
          echo "Stockfish build successful."

          ./stockfish uci | head -n 25


      # ============================================================
      # 6. PREPARE SAME NNUE FOR SIMPLELOGICS
      # ============================================================

      - name: Prepare shared NNUE
        run: |
          mkdir -p nnue

          cp \
            official-stockfish.nnue \
            nnue/SimpleLogics-test.nnue

          echo ""
          echo "Shared NNUE:"
          ls -lh nnue/SimpleLogics-test.nnue


      # ============================================================
      # 7. BUILD SIMPLELOGICS HYBRID V2
      # ============================================================

      - name: Build SimpleLogics Hybrid V2
        run: |
          rm -rf build

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build build \
            --parallel 2

          echo ""
          echo "Build output:"
          find build -type f -perm -111 -print


      # ============================================================
      # 8. LOCATE SIMPLELOGICS
      # ============================================================

      - name: Prepare SimpleLogics binary
        run: |
          SIMPLE=$(find build \
            -type f \
            -perm -111 \
            \( \
              -name "simplelogics" \
              -o \
              -name "SimpleLogics" \
              -o \
              -name "stockfish" \
            \) \
            | head -n 1)

          if [ -z "$SIMPLE" ]; then
            echo "ERROR: SimpleLogics binary not found."
            exit 1
          fi

          echo "SimpleLogics binary:"
          echo "$SIMPLE"

          cp "$SIMPLE" ./simplelogics

          chmod +x ./simplelogics

          echo ""
          echo "SimpleLogics UCI:"
          ./simplelogics uci


      # ============================================================
      # 9. PREPARE STOCKFISH
      # ============================================================

      - name: Prepare Stockfish binary
        run: |
          cp \
            stockfish-test/src/stockfish \
            ./stockfish

          chmod +x ./stockfish

          echo ""
          echo "Stockfish UCI:"
          ./stockfish uci | head -n 25


      # ============================================================
      # 10. VERIFY HYBRID OPTIONS
      # ============================================================

      - name: Verify Hybrid V2 options
        run: |
          echo "=============================================="
          echo " SIMPLELOGICS HYBRID OPTIONS"
          echo "=============================================="

          ./simplelogics uci | grep -E \
            "SimpleLogics|Hybrid|LMR|Human"

          echo ""
          echo "=============================================="
          echo " VERIFY STOCKFISH"
          echo "=============================================="

          ./stockfish uci | grep -E \
            "EvalFile|Threads|Hash"


      # ============================================================
      # 11. BENCHMARK
      # ============================================================

      - name: Run benchmark
        run: |
          echo "=============================================="
          echo " STOCKFISH BENCH"
          echo "=============================================="

          ./stockfish bench \
            16 \
            1 \
            1 \
            default \
            depth 10

          echo ""
          echo "=============================================="
          echo " SIMPLELOGICS HYBRID V2 BENCH"
          echo "=============================================="

          ./simplelogics bench \
            16 \
            1 \
            1 \
            default \
            depth 10


      # ============================================================
      # 12. CREATE TOURNAMENT SCRIPT
      # ============================================================

      - name: Create tournament script
        run: |
          cat > tournament.py <<'PYTHON'

          import chess
          import chess.pgn
          import chess.engine
          import os


          SIMPLELOGICS = os.path.abspath("./simplelogics")
          STOCKFISH = os.path.abspath("./stockfish")

          GAMES = 100
          NODES = 10000
          MAX_PLIES = 180

          RESULTS_DIR = "results"

          os.makedirs(
              RESULTS_DIR,
              exist_ok=True
          )


          def configure_engine(engine, simplelogics):

              try:
                  engine.configure({
                      "Threads": 1,
                      "Hash": 32
                  })
              except Exception:
                  pass


              if simplelogics:

                  try:
                      engine.configure({
                          "SimpleLogics Human Mode": False
                      })
                  except Exception:
                      pass


                  try:
                      engine.configure({
                          "SimpleLogics Human Elo": 2650
                      })
                  except Exception:
                      pass


                  try:
                      engine.configure({
                          "SimpleLogics LMR Boost": True
                      })
                  except Exception:
                      pass


                  try:
                      engine.configure({
                          "SimpleLogics Hybrid Search": True
                      })
                  except Exception:
                      pass


          def play_game(game_number):

              simple_white = (
                  game_number % 2 == 1
              )

              white_name = (
                  "SimpleLogics"
                  if simple_white
                  else
                  "Stockfish"
              )

              black_name = (
                  "Stockfish"
                  if simple_white
                  else
                  "SimpleLogics"
              )

              print(
                  "",
                  flush=True
              )

              print(
                  f"GAME {game_number}/{GAMES}: "
                  f"{white_name} WHITE - "
                  f"{black_name} BLACK",
                  flush=True
              )


              white_engine = None
              black_engine = None


              try:

                  white_path = (
                      SIMPLELOGICS
                      if simple_white
                      else STOCKFISH
                  )

                  black_path = (
                      STOCKFISH
                      if simple_white
                      else SIMPLELOGICS
                  )


                  white_engine = (
                      chess.engine
                      .SimpleEngine
                      .popen_uci(
                          white_path
                      )
                  )

                  black_engine = (
                      chess.engine
                      .SimpleEngine
                      .popen_uci(
                          black_path
                      )
                  )


                  configure_engine(
                      white_engine,
                      simple_white
                  )

                  configure_engine(
                      black_engine,
                      not simple_white
                  )


                  board = chess.Board()


                  game = chess.pgn.Game()

                  game.headers[
                      "Event"
                  ] = (
                      "SimpleLogics Hybrid V2 "
                      "Strength Test"
                  )

                  game.headers[
                      "Site"
                  ] = "GitHub Actions"

                  game.headers[
                      "Round"
                  ] = str(game_number)

                  game.headers[
                      "White"
                  ] = white_name

                  game.headers[
                      "Black"
                  ] = black_name

                  game.headers[
                      "NodesPerMove"
                  ] = str(NODES)

                  node = game


                  for ply in range(
                      MAX_PLIES
                  ):

                      if board.is_game_over(
                          claim_draw=True
                      ):
                          break


                      engine = (
                          white_engine
                          if board.turn == chess.WHITE
                          else black_engine
                      )


                      try:

                          result = engine.play(
                              board,
                              chess.engine.Limit(
                                  nodes=NODES
                              )
                          )

                      except Exception as error:

                          print(
                              "ENGINE ERROR:",
                              error,
                              flush=True
                          )

                          if board.turn == chess.WHITE:
                              game.headers[
                                  "Result"
                              ] = "0-1"
                          else:
                              game.headers[
                                  "Result"
                              ] = "1-0"

                          game.headers[
                              "Termination"
                          ] = "engine error"

                          return game


                      move = result.move


                      if (
                          move is None
                          or move not in board.legal_moves
                      ):

                          print(
                              "ILLEGAL MOVE",
                              flush=True
                          )

                          if board.turn == chess.WHITE:
                              game.headers[
                                  "Result"
                              ] = "0-1"
                          else:
                              game.headers[
                                  "Result"
                              ] = "1-0"

                          game.headers[
                              "Termination"
                          ] = "illegal move"

                          return game


                      node = node.add_variation(
                          move
                      )

                      board.push(move)


                  # =================================================
                  # RESULT
                  # =================================================

                  if board.is_checkmate():

                      result = (
                          "0-1"
                          if board.turn == chess.WHITE
                          else "1-0"
                      )

                      termination = "checkmate"


                  elif board.is_stalemate():

                      result = "1/2-1/2"
                      termination = "stalemate"


                  elif board.is_insufficient_material():

                      result = "1/2-1/2"
                      termination = (
                          "insufficient material"
                      )


                  elif board.can_claim_fifty_moves():

                      result = "1/2-1/2"
                      termination = (
                          "50-move rule"
                      )


                  elif board.can_claim_threefold_repetition():

                      result = "1/2-1/2"
                      termination = (
                          "threefold repetition"
                      )


                  else:

                      result = "1/2-1/2"
                      termination = (
                          "maximum plies"
                      )


                  game.headers[
                      "Result"
                  ] = result

                  game.headers[
                      "Termination"
                  ] = termination

                  game.headers[
                      "PlyCount"
                  ] = str(board.ply())


                  print(
                      f"RESULT: "
                      f"{white_name} - "
                      f"{black_name} = "
                      f"{result} "
                      f"({termination})",
                      flush=True
                  )


                  return game


              finally:

                  if white_engine:

                      try:
                          white_engine.quit()
                      except Exception:
                          pass


                  if black_engine:

                      try:
                          black_engine.quit()
                      except Exception:
                          pass


          def main():

              pgn_path = os.path.join(
                  RESULTS_DIR,
                  "hybrid-v2-strength-test.pgn"
              )


              simple_wins = 0
              stockfish_wins = 0
              draws = 0


              with open(
                  pgn_path,
                  "w",
                  encoding="utf-8"
              ) as pgn_file:


                  for game_number in range(
                      1,
                      GAMES + 1
                  ):

                      game = play_game(
                          game_number
                      )


                      result = game.headers.get(
                          "Result",
                          "*"
                      )


                      if result == "1/2-1/2":

                          draws += 1


                      elif result == "1-0":

                          if (
                              game.headers[
                                  "White"
                              ]
                              == "SimpleLogics"
                          ):
                              simple_wins += 1

                          else:
                              stockfish_wins += 1


                      elif result == "0-1":

                          if (
                              game.headers[
                                  "Black"
                              ]
                              == "SimpleLogics"
                          ):
                              simple_wins += 1

                          else:
                              stockfish_wins += 1


                      exporter = (
                          chess.pgn.StringExporter(
                              headers=True,
                              variations=True,
                              comments=False
                          )
                      )


                      pgn_file.write(
                          game.accept(
                              exporter
                          )
                      )

                      pgn_file.write(
                          "\n\n"
                      )

                      pgn_file.flush()


                      print(
                          f"Running score: "
                          f"SimpleLogics "
                          f"{simple_wins}, "
                          f"Stockfish "
                          f"{stockfish_wins}, "
                          f"Draws "
                          f"{draws}",
                          flush=True
                      )


              score = (
                  simple_wins
                  + draws * 0.5
              )


              percentage = (
                  100.0
                  * score
                  / GAMES
              )


              print("")
              print(
                  "================================================"
              )
              print(
                  " SIMPLELOGICS HYBRID V2 RESULT"
              )
              print(
                  "================================================"
              )
              print(
                  f"Games       : {GAMES}"
              )
              print(
                  f"Simple wins : {simple_wins}"
              )
              print(
                  f"Stockfish   : {stockfish_wins}"
              )
              print(
                  f"Draws       : {draws}"
              )
              print(
                  f"Score       : {score:.1f}/{GAMES}"
              )
              print(
                  f"Score %     : {percentage:.1f}%"
              )
              print(
                  "================================================"
              )
              print("")
              print(
                  "Both engines used the SAME official NNUE."
              )
              print(
                  "SimpleLogics: Hybrid V2 ENABLED"
              )
              print(
                  "Nodes/move  : 10,000"
              )
              print(
                  "Games       : 100"
              )
              print(
                  "================================================"
              )


          if __name__ == "__main__":
              main()

          PYTHON

          python3 -m py_compile tournament.py


      # ============================================================
      # 13. RUN 100 GAMES
      # ============================================================

      - name: Run 100 game Hybrid V2 test
        run: |
          python3 tournament.py


      # ============================================================
      # 14. SHOW RESULT
      # ============================================================

      - name: Show final result
        run: |
          echo ""
          echo "================================================"
          echo " FINAL HYBRID V2 RESULT"
          echo "================================================"

          ls -lh results/

          echo ""

          echo "PGN:"
          wc -l \
            results/hybrid-v2-strength-test.pgn

          echo ""
          echo "================================================"


      # ============================================================
      # 15. UPLOAD PGN
      # ============================================================

      - name: Upload Hybrid V2 PGN
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Hybrid-V2-Strength-Test
          path: results/hybrid-v2-strength-test.pgn
          retention-days: 14
