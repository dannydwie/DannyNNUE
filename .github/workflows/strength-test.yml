name: SimpleLogics 1.0 Strength Test

on:
  workflow_dispatch:

jobs:
  strength-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout SimpleLogics
        uses: actions/checkout@v4


      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            python3 \
            python3-pip

          python3 -m pip install \
            python-chess \
            --break-system-packages


      # ============================================================
      # 3. EXACT STOCKFISH SOURCE
      # ============================================================

      - name: Clone Stockfish
        run: |
          git clone \
            --depth 1 \
            --branch stockfish-dev-20260922-0a215d6c \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish-test


      # ============================================================
      # 4. OFFICIAL NNUE
      # ============================================================

      - name: Download official NNUE
        working-directory: stockfish-test/src
        run: |

          echo "=============================================="
          echo " DOWNLOADING OFFICIAL NNUE"
          echo "=============================================="

          make net

          NET=$(find . \
            -maxdepth 1 \
            -type f \
            -name 'nn-*.nnue' \
            | head -n 1)

          if [ -z "$NET" ]; then
            echo "ERROR: Official NNUE not found."
            exit 1
          fi

          echo ""
          echo "Official NNUE:"
          echo "$NET"

          ls -lh "$NET"

          cp "$NET" ../../official.nnue


      # ============================================================
      # 5. BUILD OFFICIAL STOCKFISH
      # ============================================================

      - name: Build Stockfish
        working-directory: stockfish-test/src
        run: |

          make -j2 \
            build \
            ARCH=x86-64-modern

          test -x stockfish

          echo ""
          echo "Stockfish build OK."


      # ============================================================
      # 6. BUILD SIMPLELOGICS
      #
      # CMakeLists.txt automatically downloads the same official
      # compatible NNUE for the same Stockfish source.
      # ============================================================

      - name: Build SimpleLogics
        run: |

          rm -rf build

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build build \
            --parallel 2

          test -x build/SimpleLogics

          echo ""
          echo "SimpleLogics build OK."


      # ============================================================
      # 7. PREPARE ENGINES
      # ============================================================

      - name: Prepare engines
        run: |

          cp \
            stockfish-test/src/stockfish \
            ./stockfish

          cp \
            build/SimpleLogics \
            ./simplelogics

          chmod +x \
            ./stockfish \
            ./simplelogics

          echo ""
          echo "=============================================="
          echo " SIMPLELOGICS UCI"
          echo "=============================================="

          printf 'uci\nquit\n' \
            | ./simplelogics \
            | head -n 30

          echo ""
          echo "=============================================="
          echo " STOCKFISH UCI"
          echo "=============================================="

          printf 'uci\nquit\n' \
            | ./stockfish \
            | head -n 30


      # ============================================================
      # 8. BENCHMARK
      # ============================================================

      - name: Benchmark
        run: |

          echo "=============================================="
          echo " STOCKFISH BENCH"
          echo "=============================================="

          ./stockfish \
            bench \
            16 \
            1 \
            1 \
            default \
            depth 12

          echo ""
          echo "=============================================="
          echo " SIMPLELOGICS BENCH"
          echo "=============================================="

          ./simplelogics \
            bench \
            16 \
            1 \
            1 \
            default \
            depth 12


      # ============================================================
      # 9. 100 GAME STRENGTH TEST
      # ============================================================

      - name: Run 100 game strength test
        run: |

          cat > tournament.py <<'PY'

          import chess
          import chess.engine
          import chess.pgn
          import os


          SIMPLE = os.path.abspath("./simplelogics")
          STOCK = os.path.abspath("./stockfish")


          GAMES = 100

          # Higher than previous 10k-node test.
          NODES = 50000

          MAX_PLIES = 220


          os.makedirs(
              "results",
              exist_ok=True
          )


          simple_wins = 0
          stock_wins = 0
          draws = 0


          def configure(engine):

              engine.configure({
                  "Threads": 1,
                  "Hash": 64
              })


          def play_game(number):

              simple_white = (
                  number % 2 == 1
              )


              white_path = (
                  SIMPLE
                  if simple_white
                  else STOCK
              )


              black_path = (
                  STOCK
                  if simple_white
                  else SIMPLE
              )


              white_name = (
                  "SimpleLogics"
                  if simple_white
                  else "Stockfish"
              )


              black_name = (
                  "Stockfish"
                  if simple_white
                  else "SimpleLogics"
              )


              white = (
                  chess.engine
                  .SimpleEngine
                  .popen_uci(
                      white_path
                  )
              )


              black = (
                  chess.engine
                  .SimpleEngine
                  .popen_uci(
                      black_path
                  )
              )


              try:

                  configure(white)
                  configure(black)


                  board = chess.Board()


                  game = chess.pgn.Game()


                  game.headers[
                      "Event"
                  ] = (
                      "SimpleLogics 1.0 "
                      "Strength Test"
                  )


                  game.headers[
                      "Round"
                  ] = str(number)


                  game.headers[
                      "White"
                  ] = white_name


                  game.headers[
                      "Black"
                  ] = black_name


                  game.headers[
                      "NodesPerMove"
                  ] = str(NODES)


                  node = game


                  for ply in range(
                      MAX_PLIES
                  ):

                      if board.is_game_over(
                          claim_draw=True
                      ):
                          break


                      engine = (
                          white
                          if board.turn == chess.WHITE
                          else black
                      )


                      result = engine.play(
                          board,
                          chess.engine.Limit(
                              nodes=NODES
                          )
                      )


                      move = result.move


                      node = (
                          node.add_variation(
                              move
                          )
                      )


                      board.push(move)


                  result = board.result(
                      claim_draw=True
                  )


                  game.headers[
                      "Result"
                  ] = result


                  with open(
                      f"results/game_{number:03d}.pgn",
                      "w",
                      encoding="utf-8"
                  ) as f:

                      print(
                          game,
                          file=f
                      )


                  print(
                      f"GAME {number:03d}/100  "
                      f"{white_name} - "
                      f"{black_name}  "
                      f"{result}",
                      flush=True
                  )


                  return (
                      result,
                      simple_white
                  )


              finally:

                  white.quit()
                  black.quit()


          # ========================================================
          # RUN MATCH
          # ========================================================

          for number in range(
              1,
              GAMES + 1
          ):

              result, simple_white = (
                  play_game(number)
              )


              if result == "1/2-1/2":

                  draws += 1


              elif (
                  result == "1-0"
                  and simple_white
              ) or (
                  result == "0-1"
                  and not simple_white
              ):

                  simple_wins += 1


              else:

                  stock_wins += 1


          # ========================================================
          # FINAL SCORE
          # ========================================================

          score = (
              (
                  simple_wins
                  + (0.5 * draws)
              )
              / GAMES
              * 100
          )


          print("")
          print("")
          print("==============================================")
          print(" SIMPLELOGICS 1.0 FINAL RESULT")
          print("==============================================")
          print("")
          print(
              "SimpleLogics wins :",
              simple_wins
          )
          print(
              "Stockfish wins    :",
              stock_wins
          )
          print(
              "Draws             :",
              draws
          )
          print(
              f"Score             : {score:.1f}%"
          )
          print("")
          print(
              "Games             :",
              GAMES
          )
          print(
              "Nodes / move      :",
              NODES
          )
          print("")
          print("==============================================")

          PY


          python3 tournament.py


      # ============================================================
      # 10. UPLOAD RESULTS
      # ============================================================

      - name: Upload PGN results
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-1.0-strength-results
          path: results/
          if-no-files-found: error
          retention-days: 30
