name: SimpleLogics Official NNUE Diagnostic

on:
  workflow_dispatch:

jobs:
  strength-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. Checkout SimpleLogics
      # ============================================================
      - name: Checkout SimpleLogics
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            python3 \
            python3-pip \
            wget \
            cutechess

      # ============================================================
      # 3. Build OFFICIAL Stockfish baseline
      #    Same exact Stockfish tag used by SimpleLogics
      # ============================================================
      - name: Clone official Stockfish
        run: |
          git clone --depth 1 \
            --branch stockfish-dev-20260919-17a6c8f1 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish-test

      # ============================================================
      # 4. Download official NNUE used by that Stockfish tag
      # ============================================================
      - name: Download official Stockfish NNUE
        working-directory: stockfish-test/src
        run: |
          make net

          echo "Official NNUE files:"
          ls -lh nn-*.nnue

          NET=$(find . -maxdepth 1 -name 'nn-*.nnue' -type f | head -n 1)

          if [ -z "$NET" ]; then
            echo "ERROR: Official Stockfish NNUE was not downloaded."
            exit 1
          fi

          echo "Using official network:"
          echo "$NET"

          cp "$NET" ../../official-stockfish.nnue

      # ============================================================
      # 5. Build official Stockfish
      # ============================================================
      - name: Build official Stockfish
        working-directory: stockfish-test/src
        run: |
          make -j2 build ARCH=x86-64-modern

          if [ ! -f stockfish ]; then
            echo "ERROR: Stockfish build failed."
            exit 1
          fi

          ./stockfish bench 16 1 1 default depth 8

      # ============================================================
      # 6. Prepare official NNUE for SimpleLogics
      # ============================================================
      - name: Prepare official NNUE for SimpleLogics
        run: |
          mkdir -p nnue

          cp official-stockfish.nnue \
            nnue/SimpleLogics-test.nnue

          echo "SimpleLogics will use:"
          ls -lh nnue/SimpleLogics-test.nnue

      # ============================================================
      # 7. Build SimpleLogics
      # ============================================================
      - name: Build SimpleLogics
        run: |
          rm -rf build

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel 2

          echo "Searching for SimpleLogics binary:"
          find build -type f -perm -111 -print

      # ============================================================
      # 8. Locate SimpleLogics binary
      # ============================================================
      - name: Locate SimpleLogics binary
        run: |
          SIMPLE=$(find build -type f -perm -111 \
            \( -name "simplelogics" -o -name "SimpleLogics" \) \
            | head -n 1)

          if [ -z "$SIMPLE" ]; then
            echo "ERROR: SimpleLogics binary not found."
            exit 1
          fi

          echo "SimpleLogics binary:"
          echo "$SIMPLE"

          cp "$SIMPLE" ./simplelogics

          chmod +x ./simplelogics

          ./simplelogics uci

      # ============================================================
      # 9. Prepare Stockfish binary
      # ============================================================
      - name: Prepare Stockfish binary
        run: |
          cp stockfish-test/src/stockfish ./stockfish
          chmod +x ./stockfish

          echo "Stockfish:"
          ./stockfish uci | head -n 20

      # ============================================================
      # 10. Verify both engines
      # ============================================================
      - name: Verify engines
        run: |
          echo "======================================"
          echo "STOCKFISH BENCH"
          echo "======================================"

          ./stockfish bench 16 1 1 default depth 10

          echo ""
          echo "======================================"
          echo "SIMPLELOGICS BENCH"
          echo "======================================"

          ./simplelogics bench 16 1 1 default depth 10

      # ============================================================
      # 11. Run 100 game diagnostic
      #
      # Same official NNUE on both engines.
      # 10,000 nodes/move.
      # Colors alternate.
      # ============================================================
      - name: Run 100 game diagnostic
        run: |
          mkdir -p results

          cutechess-cli \
            -engine name=SimpleLogics cmd=./simplelogics \
            -engine name=Stockfish cmd=./stockfish \
            -each \
              proto=uci \
              tc=inf nodes=10000 \
              option.SimpleLogics\ Human\ Mode=false \
              option.SimpleLogics\ LMR\ Boost=true \
            -games 100 \
            -repeat \
            -rounds 50 \
            -openings file=/usr/share/games/chess/*.pgn \
            -concurrency 2 \
            -maxmoves 180 \
            -recover \
            -pgnout results/official-nnue-diagnostic.pgn \
            -resign movecount=3 score=1000 \
            -draw movenumber=40 movecount=8 score=10

      # ============================================================
      # 12. Summary
      # ============================================================
      - name: Print diagnostic result
        run: |
          echo ""
          echo "================================================"
          echo " SIMPLELOGICS OFFICIAL NNUE DIAGNOSTIC"
          echo "================================================"
          echo ""
          echo "Both engines used the SAME official NNUE."
          echo "Stockfish tag:"
          echo "stockfish-dev-20260919-17a6c8f1"
          echo ""
          echo "Time control:"
          echo "10,000 nodes / move"
          echo ""
          echo "Games:"
          echo "100"
          echo ""
          echo "PGN:"
          ls -lh results/official-nnue-diagnostic.pgn
          echo ""
          echo "================================================"

      # ============================================================
      # 13. Upload PGN
      # ============================================================
      - name: Upload diagnostic PGN
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Official-NNUE-Diagnostic
          path: results/official-nnue-diagnostic.pgn
          retention-days: 14
