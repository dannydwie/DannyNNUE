name: SimpleLogics Official NNUE Diagnostic

on:
  workflow_dispatch:

jobs:
  strength-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout SimpleLogics
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            python3 \
            python3-pip \
            wget

          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install python-chess --break-system-packages

      # ============================================================
      # 3. CLONE EXACT STOCKFISH VERSION
      # ============================================================
      - name: Clone official Stockfish
        run: |
          git clone --depth 1 \
            --branch stockfish-dev-20260919-17a6c8f1 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish-test

      # ============================================================
      # 4. DOWNLOAD OFFICIAL STOCKFISH NNUE
      # ============================================================
      - name: Download official Stockfish NNUE
        working-directory: stockfish-test/src
        run: |
          echo "Downloading official Stockfish NNUE..."

          make net

          echo ""
          echo "Available NNUE files:"
          ls -lh nn-*.nnue

          NET=$(find . -maxdepth 1 -type f -name 'nn-*.nnue' | head -n 1)

          if [ -z "$NET" ]; then
            echo "ERROR: Official NNUE not found."
            exit 1
          fi

          echo ""
          echo "Official NNUE selected:"
          echo "$NET"

          cp "$NET" ../../official-stockfish.nnue

          echo ""
          echo "Copied official NNUE:"
          ls -lh ../../official-stockfish.nnue

      # ============================================================
      # 5. BUILD OFFICIAL STOCKFISH
      # ============================================================
      - name: Build official Stockfish
        working-directory: stockfish-test/src
        run: |
          make -j2 build ARCH=x86-64-modern

          if [ ! -f stockfish ]; then
            echo "ERROR: Stockfish binary was not created."
            exit 1
          fi

          echo "Stockfish build OK."

          ./stockfish uci | head -n 20

      # ============================================================
      # 6. PREPARE OFFICIAL NNUE FOR SIMPLELOGICS
      # ============================================================
      - name: Prepare official NNUE
        run: |
          mkdir -p nnue

          cp official-stockfish.nnue \
            nnue/SimpleLogics-test.nnue

          echo "NNUE used by SimpleLogics:"
          ls -lh nnue/SimpleLogics-test.nnue

      # ============================================================
      # 7. BUILD SIMPLELOGICS
      # ============================================================
      - name: Build SimpleLogics
        run: |
          rm -rf build

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel 2

          echo ""
          echo "Executable files:"
          find build -type f -perm -111 -print

      # ============================================================
      # 8. FIND SIMPLELOGICS
      # ============================================================
      - name: Prepare SimpleLogics binary
        run: |
          SIMPLE=$(find build -type f -perm -111 \
            \( \
              -name "simplelogics" \
              -o -name "SimpleLogics" \
              -o -name "stockfish" \
            \) | head -n 1)

          if [ -z "$SIMPLE" ]; then
            echo "ERROR: SimpleLogics binary not found."
            exit 1
          fi

          echo "SimpleLogics binary:"
          echo "$SIMPLE"

          cp "$SIMPLE" ./simplelogics

          chmod +x ./simplelogics

          echo ""
          echo "Testing SimpleLogics UCI:"
          ./simplelogics uci

      # ============================================================
      # 9. PREPARE STOCKFISH BINARY
      # ============================================================
      - name: Prepare Stockfish binary
        run: |
          cp stockfish-test/src/stockfish ./stockfish

          chmod +x ./stockfish

          echo "Testing Stockfish UCI:"
          ./stockfish uci | head -n 20

      # ============================================================
      # 10. BENCH BOTH ENGINES
      # ============================================================
      - name: Run engine benchmark
        run: |
          echo "=============================================="
          echo " STOCKFISH BENCH"
          echo "=============================================="

          ./stockfish bench 16 1 1 default depth 10

          echo ""
          echo "=============================================="
          echo " SIMPLELOGICS BENCH"
          echo "=============================================="

          ./simplelogics bench 16 1 1 default depth 10

      # ============================================================
      # 11. CREATE PYTHON TOURNAMENT SCRIPT
      # ============================================================
      - name: Create tournament script
        run: |
          cat > tournament.py <<'PYTHON'
          import chess
          import chess.pgn
          import chess.engine
          import os
          import sys
          import time

          SIMPLELOGICS = os.path.abspath("./simplelogics")
          STOCKFISH = os.path.abspath("./stockfish")

          GAMES = 100
          NODES = 10000
          MAX_PLIES = 180

          RESULTS_DIR = "results"
          os.makedirs(RESULTS_DIR, exist_ok=True)

          def configure(engine, simple=False):
              try:
                  engine.configure({
                      "Threads": 1,
                      "Hash": 32
                  })
              except Exception:
                  pass

              if simple:
                  try:
                      engine.configure({
                          "SimpleLogics Human Mode": False
                      })
                  except Exception:
                      pass

                  try:
                      engine.configure({
                          "SimpleLogics LMR Boost": True
                      })
                  except Exception:
                      pass

          def play_game(game_number):
              simple_white = (game_number % 2 == 1)

              white_name = "SimpleLogics" if simple_white else "Stockfish"
              black_name = "Stockfish" if simple_white else "SimpleLogics"

              print(
                  f"\nGAME {game_number}/{GAMES}: "
                  f"{white_name} WHITE - {black_name} BLACK",
                  flush=True
              )

              white_engine = None
              black_engine = None

              try:
                  white_path = SIMPLELOGICS if simple_white else STOCKFISH
                  black_path = STOCKFISH if simple_white else SIMPLELOGICS

                  white_engine = chess.engine.SimpleEngine.popen_uci(white_path)
                  black_engine = chess.engine.SimpleEngine.popen_uci(black_path)

                  configure(white_engine, simple=simple_white)
                  configure(black_engine, simple=not simple_white)

                  board = chess.Board()

                  game = chess.pgn.Game()
                  game.headers["Event"] = "SimpleLogics Official NNUE Diagnostic"
                  game.headers["Site"] = "GitHub Actions"
                  game.headers["Round"] = str(game_number)
                  game.headers["White"] = white_name
                  game.headers["Black"] = black_name
                  game.headers["WhiteEngine"] = white_name
                  game.headers["BlackEngine"] = black_name
                  game.headers["NodesPerMove"] = str(NODES)

                  node = game

                  for ply in range(MAX_PLIES):
                      if board.is_game_over(claim_draw=True):
                          break

                      engine = white_engine if board.turn == chess.WHITE else black_engine

                      try:
                          result = engine.play(
                              board,
                              chess.engine.Limit(nodes=NODES)
                          )
                      except Exception as e:
                          print(
                              f"Engine error in game {game_number}: {e}",
                              flush=True
                          )
                          game.headers["Result"] = "0-1" if board.turn == chess.WHITE else "1-0"
                          game.headers["Termination"] = "engine error"
                          return game

                      move = result.move

                      if move is None or move not in board.legal_moves:
                          print(
                              f"Illegal/no move in game {game_number}",
                              flush=True
                          )
                          game.headers["Result"] = "0-1" if board.turn == chess.WHITE else "1-0"
                          game.headers["Termination"] = "illegal move"
                          return game

                      node = node.add_variation(move)
                      board.push(move)

                  if board.is_checkmate():
                      result = "0-1" if board.turn == chess.WHITE else "1-0"
                      termination = "checkmate"
                  elif board.is_stalemate():
                      result = "1/2-1/2"
                      termination = "stalemate"
                  elif board.is_insufficient_material():
                      result = "1/2-1/2"
                      termination = "insufficient material"
                  elif board.can_claim_fifty_moves():
                      result = "1/2-1/2"
                      termination = "50-move rule"
                  elif board.can_claim_threefold_repetition():
                      result = "1/2-1/2"
                      termination = "threefold repetition"
                  else:
                      result = "1/2-1/2"
                      termination = "maximum plies"

                  game.headers["Result"] = result
                  game.headers["Termination"] = termination
                  game.headers["PlyCount"] = str(board.ply())

                  print(
                      f"RESULT: {white_name} - {black_name} = "
                      f"{result} ({termination})",
                      flush=True
                  )

                  return game

              finally:
                  if white_engine is not None:
                      try:
                          white_engine.quit()
                      except Exception:
                          pass

                  if black_engine is not None:
                      try:
                          black_engine.quit()
                      except Exception:
                          pass

          def main():
              pgn_path = os.path.join(
                  RESULTS_DIR,
                  "official-nnue-diagnostic.pgn"
              )

              simple_wins = 0
              stockfish_wins = 0
              draws = 0

              with open(pgn_path, "w", encoding="utf-8") as pgn_file:

                  for game_number in range(1, GAMES + 1):

                      game = play_game(game_number)

                      result = game.headers.get("Result", "*")

                      if result == "1/2-1/2":
                          draws += 1
                      elif result == "1-0":
                          if game.headers["White"] == "SimpleLogics":
                              simple_wins += 1
                          else:
                              stockfish_wins += 1
                      elif result == "0-1":
                          if game.headers["Black"] == "SimpleLogics":
                              simple_wins += 1
                          else:
                              stockfish_wins += 1

                      exporter = chess.pgn.StringExporter(
                          headers=True,
                          variations=True,
                          comments=False
                      )

                      pgn_file.write(game.accept(exporter))
                      pgn_file.write("\n\n")
                      pgn_file.flush()

                      print(
                          f"Running score: "
                          f"SimpleLogics {simple_wins}, "
                          f"Stockfish {stockfish_wins}, "
                          f"Draws {draws}",
                          flush=True
                      )

              total_score = simple_wins + draws * 0.5
              score_percent = 100.0 * total_score / GAMES

              print("\n")
              print("================================================")
              print(" SIMPLELOGICS OFFICIAL NNUE DIAGNOSTIC")
              print("================================================")
              print(f"Games       : {GAMES}")
              print(f"Simple wins : {simple_wins}")
              print(f"Stockfish   : {stockfish_wins}")
              print(f"Draws       : {draws}")
              print(f"Score       : {total_score:.1f}/{GAMES}")
              print(f"Score %     : {score_percent:.1f}%")
              print("================================================")
              print("")
              print("Both engines used the SAME official Stockfish NNUE.")
              print("Stockfish:")
              print("stockfish-dev-20260919-17a6c8f1")
              print(f"Nodes/move: {NODES}")
              print("================================================")

          if __name__ == "__main__":
              main()
          PYTHON

          python3 -m py_compile tournament.py

      # ============================================================
      # 12. RUN 100 GAME TEST
      # ============================================================
      - name: Run 100 game diagnostic
        run: |
          python3 tournament.py

      # ============================================================
      # 13. SHOW RESULT
      # ============================================================
      - name: Show final result
        run: |
          echo ""
          echo "================================================"
          echo " FINAL DIAGNOSTIC RESULT"
          echo "================================================"

          ls -lh results/

          echo ""
          echo "PGN games:"
          wc -l results/official-nnue-diagnostic.pgn

          echo ""
          echo "================================================"

      # ============================================================
      # 14. UPLOAD PGN
      # ============================================================
      - name: Upload diagnostic PGN
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Official-NNUE-Diagnostic
          path: results/official-nnue-diagnostic.pgn
          retention-days: 14
